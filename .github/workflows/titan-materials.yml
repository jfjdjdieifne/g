name: Titan primary-source materials
on:
  push:
    branches: [arena/b2ef2032-g]
    paths: [.github/workflows/titan-materials.yml]
permissions:
  contents: write
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Fetch ordinary public investigative material
        run: |
          set -euo pipefail
          command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          mkdir -p /tmp/titan
          python3 - <<'PY'
          import urllib.request,json,hashlib,subprocess,sys,traceback
          def onerror(t,v,tb):
            print('::error::'+str(v));traceback.print_exception(t,v,tb)
          sys.excepthook=onerror
          from pathlib import Path
          p=Path('/tmp/titan');rows=[]
          items=[('ntsb_report.pdf','https://www.ntsb.gov/investigations/AccidentReports/Reports/MIR2536.pdf'),('titan_descending.jpg','https://www.ntsb.gov/investigations/PublishingImages/DCA23FM036-img.jpg'),('rov_original.webm','https://upload.wikimedia.org/wikipedia/commons/5/5c/OceanGate_Titan_submersible_ocean_floor_footage.webm')]
          for name,url in items:
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (compatible; DocumentaryResearch/1.0)'})
              with urllib.request.urlopen(req,timeout=60) as r:data=r.read(55000000)
              (p/name).write_bytes(data);rows.append({'file':name,'url':url,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest(),'viewed':False,'heard':False,'rights':'Unreviewed; provenance and third-party rights require inspection. No access bypass.'})
            except Exception as e:
              rows.append({'file':name,'url':url,'error':str(e)});print('::warning::'+name+' '+str(e))
          if (p/'rov_original.webm').exists():subprocess.run(['ffmpeg','-v','error','-y','-i',str(p/'rov_original.webm'),'-vf','scale=1280:-2','-an','-c:v','libx264','-preset','fast','-crf','20',str(p/'rov_tail.mp4')],check=True)
          # Retain source hash/URL, compact original-pixel transcode. No alteration of marks.
          (p/'rov_original.webm').unlink(missing_ok=True)
          (p/'retrieval_sources.json').write_text(json.dumps(rows,indent=2))
          print(json.dumps(rows,indent=2))
          PY
      - name: Store bounded research object without media commit
        if: always()
        id: stash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json,base64,subprocess,os,tarfile
          from pathlib import Path
          p=Path('/tmp/titan');out=Path('/tmp/titan.tar.gz')
          with tarfile.open(out,'w:gz') as t:
            for f in p.iterdir():t.add(f,arcname=f.name)
          data=out.read_bytes();assert len(data)<60000000
          payload=json.dumps({'content':base64.b64encode(data).decode(),'encoding':'base64'})
          r=json.loads(subprocess.check_output(['gh','api','--method','POST','repos/'+os.environ['REPO']+'/git/blobs','--input','-'],input=payload.encode()))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('sha='+r['sha']+'\n')
          PY
      - name: Research object ${{ steps.stash.outputs.sha }}
        run: echo 'Public primary-source research only. Not yet viewed, heard or publication-cleared.'
