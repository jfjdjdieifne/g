name: Intro5 original industry sequence research
on:
  push:
    branches: [arena/b2ef2032-g]
    paths: [.github/workflows/intro5-pbs-industry.yml]
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect distinct public original programmes, never bypass access blocks
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          ffmpeg -version
          python3 -m pip -q install yt-dlp
          mkdir -p /tmp/intro5
          python3 - <<'PY'
          import subprocess,json,concurrent.futures,urllib.request,re
          FF='ffmpeg'
          from pathlib import Path
          root=Path('/tmp/intro5')
          sources=[('pbs_industry','https://www.pbs.org/video/the-godfather-of-cocaine-ongrgz/',840)]
          def work(item):
            key,url,dur=item;row={'id':key,'page':url,'rights_cleared':False,'manual_viewing_or_listening':False}
            try:
              if key=='abc7':
                with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'}),timeout=20)as r:html=r.read(2500000).decode('utf8','replace')
                (root/'abc7_public_page.html').write_text(html)
                row['public_media_hints']=list(dict.fromkeys(re.findall(r'https?[^\s"<>]{0,250}(?:\.mp4|\.m3u8)[^\s"<>]{0,150}',html)))[:12]
              cmd=['yt-dlp','--no-playlist','--socket-timeout','15','--retries','0','--skip-download','--dump-single-json','-f','best[height<=480]/best',url]
              p=subprocess.run(cmd,capture_output=True,text=True,timeout=55)
              (root/(key+'_extract.log')).write_text(p.stderr[-6000:])
              if p.returncode:row['error']=p.stderr[-1000:];return row
              data=json.loads(p.stdout)
              if data.get('entries'):data=data['entries'][0]
              (root/(key+'_metadata.json')).write_text(json.dumps(data,indent=2));row.update(title=data.get('title'),duration=data.get('duration'),upload_date=data.get('upload_date'),extractor=data.get('extractor'))
              for lang,subs in data.get('subtitles',{}).items():
                if lang.lower().startswith('en'):
                  for sub in subs[:2]:
                    try:
                      with urllib.request.urlopen(sub['url'],timeout=15)as r:content=r.read(3000000)
                      (root/(key+'_captions.'+sub.get('ext','txt'))).write_bytes(content)
                    except Exception:pass
                  break
              media=data.get('url')
              if not media:row['error']='No ordinary public combined audio-video format; no access workaround';return row
              cmd=[FF,'-v','error','-rw_timeout','15000000','-ss','360','-i',media,'-t',str(dur),'-vf','scale=640:-2','-c:v','libx264','-threads','2','-preset','fast','-crf','28','-maxrate','240k','-bufsize','480k','-c:a','aac','-b:a','48k','-movflags','+faststart','-y',str(root/(key+'_research.mp4'))]
              p=subprocess.run(cmd,capture_output=True,text=True,timeout=150);(root/(key+'_download.log')).write_text(p.stderr[-4000:]);row['download_returncode']=p.returncode
              if p.returncode:row['error']='Public media download failed; do not bypass'
              else:row['bounded_seconds']=dur;row['source_offset_seconds']=360
            except Exception as e:row['error']=str(e)
            return row
          with concurrent.futures.ThreadPoolExecutor(max_workers=4)as pool:rows=list(pool.map(work,sources))
          (root/'retrieval_report.json').write_text(json.dumps(rows,indent=2));print(json.dumps(rows,indent=2))
          PY
      - name: Store bounded unreferenced research object
        id: stash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json,base64,subprocess,os,tarfile
          from pathlib import Path
          root=Path('/tmp/intro5');out=Path('/tmp/intro5.tar.gz')
          with tarfile.open(out,'w:gz')as tar:
            for f in root.iterdir():
              if f.is_file() and f.stat().st_size<35000000:tar.add(f,arcname=f.name)
          data=out.read_bytes();assert len(data)<60000000
          payload=json.dumps({'content':base64.b64encode(data).decode(),'encoding':'base64'})
          r=json.loads(subprocess.check_output(['gh','api','--method','POST','repos/'+os.environ['REPO']+'/git/blobs','--input','-'],input=payload.encode()))
          with open(os.environ['GITHUB_OUTPUT'],'a')as f:f.write('sha='+r['sha']+'\n')
          PY
      - name: Research object ${{ steps.stash.outputs.sha }}
        run: echo 'Research only. Different source programmes are not yet verified usable footage; inspect actual pictures and speech.'
