name: Studio onboarding integrity
on:
  push:
    paths: ['studio/**', 'START_HERE.md', 'AGENTS.md', 'README.md', 'youtube_documentary/**', '.github/workflows/studio-checks.yml']
  pull_request:
    paths: ['studio/**', 'START_HERE.md', 'AGENTS.md', 'README.md', 'youtube_documentary/**', '.github/workflows/studio-checks.yml']
permissions:
  contents: read
jobs:
  offline-onboarding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 studio/tools/projectctl.py doctor
      - run: python3 -m unittest discover -s studio/tests -v
