<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 920" font-family="Tahoma, 'Segoe UI', system-ui, sans-serif">
  <defs>
    <filter id="cs" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.16"/>
    </filter>
    <marker id="arw" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a2926"/>
    </marker>
  </defs>

  <rect width="1440" height="920" fill="#f7f4ed"/>

  <text x="1400" y="58" text-anchor="end" font-size="32" font-weight="700" fill="#1d1c19">نمط اللوح — مخطط حركة الكاميرا</text>
  <text x="1400" y="92" text-anchor="end" font-size="17" fill="#6b655a">نموذج توضيحي لفتحة حلقة · نحو 7 ثوانٍ · كل الحركة على سطح واحد، بلا كت</text>

  <!-- board surface -->
  <rect x="70" y="140" width="1300" height="520" rx="10" fill="#ece3d0" stroke="#c9bda6" stroke-width="2"/>
  <text x="1350" y="181" text-anchor="end" font-size="12.5" fill="#8d8577">السطح أوسع من الكادر — دائماً في عناصر برّا الإطار</text>

  <!-- threads (under cards) -->
  <g stroke="#c0392b" stroke-width="2" stroke-dasharray="5 5" opacity="0.75" fill="none">
    <line x1="435" y1="385" x2="210" y2="245"/>
    <line x1="435" y1="385" x2="675" y2="245"/>
    <line x1="435" y1="385" x2="680" y2="540"/>
    <line x1="950" y1="262" x2="945" y2="545"/>
  </g>

  <!-- cards -->
  <g>
    <g transform="rotate(-2 210 245)">
      <rect x="120" y="180" width="180" height="130" rx="6" fill="#fdfbf5" stroke="#b9ad93" stroke-width="1.5" filter="url(#cs)"/>
      <rect x="132" y="192" width="156" height="76" rx="3" fill="#cdc4b0"/>
      <text x="210" y="292" text-anchor="middle" font-size="15" fill="#3a362e">أموال مخبأة</text>
    </g>
    <g transform="rotate(1.5 210 535)">
      <rect x="120" y="470" width="180" height="130" rx="6" fill="#fdfbf5" stroke="#b9ad93" stroke-width="1.5" filter="url(#cs)"/>
      <rect x="132" y="482" width="156" height="76" rx="3" fill="#bfb59f"/>
      <text x="210" y="582" text-anchor="middle" font-size="15" fill="#3a362e">مبنى — قصر</text>
    </g>

    <g transform="rotate(-1.2 435 385)">
      <rect x="340" y="300" width="190" height="170" rx="6" fill="#fdfbf5" stroke="#b9ad93" stroke-width="1.5" filter="url(#cs)"/>
      <rect x="352" y="312" width="166" height="106" rx="3" fill="#c3b9a5"/>
      <rect x="356" y="316" width="56" height="20" rx="4" fill="#ffffff" stroke="#b9ad93" opacity="0.92"/>
      <text x="384" y="331" text-anchor="middle" font-size="11" fill="#5a5346">أرشيف</text>
      <text x="435" y="447" text-anchor="middle" font-size="16" font-weight="700" fill="#241f18">بابلو إسكوبار</text>
    </g>

    <g transform="rotate(1.8 675 245)">
      <rect x="590" y="185" width="170" height="120" rx="6" fill="#fdfbf5" stroke="#b9ad93" stroke-width="1.5" filter="url(#cs)"/>
      <rect x="602" y="197" width="146" height="68" rx="3" fill="#d5cdbb"/>
      <rect x="606" y="201" width="56" height="20" rx="4" fill="#ffffff" stroke="#b9ad93" opacity="0.92"/>
      <text x="634" y="216" text-anchor="middle" font-size="11" fill="#5a5346">وثيقة</text>
      <text x="675" y="288" text-anchor="middle" font-size="15" fill="#3a362e">وثيقة رسمية</text>
    </g>
    <g transform="rotate(-1.5 680 540)">
      <rect x="590" y="480" width="180" height="120" rx="6" fill="#fdfbf5" stroke="#b9ad93" stroke-width="1.5" filter="url(#cs)"/>
      <rect x="602" y="492" width="156" height="68" rx="3" fill="#c9c0aa"/>
      <rect x="606" y="496" width="62" height="20" rx="4" fill="#ffffff" stroke="#b9ad93" opacity="0.92"/>
      <text x="637" y="511" text-anchor="middle" font-size="11" fill="#5a5346">توضيحي</text>
      <text x="680" y="583" text-anchor="middle" font-size="15" fill="#3a362e">خريطة مسار</text>
    </g>

    <g transform="rotate(-1 950 262)">
      <rect x="860" y="195" width="180" height="135" rx="6" fill="#fdfbf5" stroke="#b9ad93" stroke-width="1.5" filter="url(#cs)"/>
      <rect x="872" y="207" width="156" height="80" rx="3" fill="#c6bda8"/>
      <text x="950" y="312" text-anchor="middle" font-size="15" fill="#3a362e">شحن جوي</text>
    </g>
    <g transform="rotate(1.2 945 545)">
      <rect x="850" y="480" width="190" height="130" rx="6" fill="#fdfbf5" stroke="#b9ad93" stroke-width="1.5" filter="url(#cs)"/>
      <rect x="862" y="492" width="166" height="74" rx="3" fill="#d0c8b4"/>
      <rect x="866" y="496" width="72" height="20" rx="4" fill="#ffffff" stroke="#b9ad93" opacity="0.92"/>
      <text x="902" y="511" text-anchor="middle" font-size="11" fill="#5a5346">صورة حديثة</text>
      <text x="945" y="593" text-anchor="middle" font-size="15" fill="#3a362e">المدينة اليوم</text>
    </g>

    <g transform="rotate(1.6 1215 315)">
      <rect x="1130" y="250" width="170" height="130" rx="6" fill="#fdfbf5" stroke="#b9ad93" stroke-width="1.5" filter="url(#cs)"/>
      <rect x="1142" y="262" width="146" height="74" rx="3" fill="#c4baa4"/>
      <text x="1215" y="362" text-anchor="middle" font-size="15" fill="#3a362e">صورة صحفية</text>
    </g>
    <g transform="rotate(-1.8 1210 535)">
      <rect x="1120" y="470" width="180" height="130" rx="6" fill="#fdfbf5" stroke="#b9ad93" stroke-width="1.5" filter="url(#cs)"/>
      <rect x="1132" y="482" width="156" height="74" rx="3" fill="#cec5b1"/>
      <text x="1210" y="582" text-anchor="middle" font-size="15" fill="#3a362e">دفتر حسابات</text>
    </g>
  </g>

  <!-- camera frames -->
  <rect x="85" y="155" width="1275" height="490" rx="12" fill="none" stroke="#8d8577" stroke-width="3" opacity="0.9"/>
  <rect x="285" y="235" width="455" height="295" rx="10" fill="none" stroke="#e2452f" stroke-width="3"/>
  <rect x="765" y="205" width="555" height="420" rx="10" fill="none" stroke="#1f7a8c" stroke-width="3"/>

  <circle cx="112" cy="186" r="17" fill="#8d8577"/>
  <text x="112" y="193" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">1</text>
  <circle cx="312" cy="262" r="17" fill="#e2452f"/>
  <text x="312" y="269" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">2</text>
  <circle cx="792" cy="232" r="17" fill="#1f7a8c"/>
  <text x="792" y="239" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">3</text>

  <text x="315" y="556" font-size="14" font-weight="700" fill="#b23a28">0:00 – 2.2 ث</text>
  <text x="1305" y="616" text-anchor="end" font-size="14" font-weight="700" fill="#16606f">2.6 – 4.8 ث</text>

  <!-- camera path -->
  <g fill="none" stroke="#2a2926" stroke-width="2.5" stroke-dasharray="10 7" opacity="0.8">
    <path d="M 722,400 C 680,398 570,392 512,382" marker-end="url(#arw)"/>
    <path d="M 512,382 C 640,420 860,428 1042,415" marker-end="url(#arw)"/>
  </g>
  <text x="600" y="360" text-anchor="middle" font-size="15" font-weight="700" fill="#b23a28" stroke="#f7f4ed" stroke-width="4" paint-order="stroke">زوم عند الكلمة</text>
  <text x="800" y="452" text-anchor="middle" font-size="15" font-weight="700" fill="#16606f" stroke="#f7f4ed" stroke-width="4" paint-order="stroke">بان مستمر — بلا كت</text>

  <text x="720" y="692" text-anchor="middle" font-size="17" fill="#4a453c">قاعدة اللوح: كل الكروت موجودة على السطح من أول المشهد — الكشف يصير بحركة كاميرا، مو بقطع مونتاج</text>

  <!-- legend row 1 -->
  <circle cx="120" cy="746" r="12" fill="#8d8577"/>
  <text x="120" y="752" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">1</text>
  <text x="140" y="752" font-size="15" fill="#3a362e">افتتاحية واسعة (كل الكروت ظاهرة)</text>

  <circle cx="480" cy="746" r="12" fill="#e2452f"/>
  <text x="480" y="752" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">2</text>
  <text x="500" y="752" font-size="15" fill="#3a362e">دوللي-إن عند نطق الكلمة</text>

  <circle cx="810" cy="746" r="12" fill="#1f7a8c"/>
  <text x="810" y="752" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">3</text>
  <text x="830" y="752" font-size="15" fill="#3a362e">بان يكشف ما كان خارج الإطار</text>

  <!-- legend row 2 -->
  <line x1="120" y1="800" x2="175" y2="800" stroke="#2a2926" stroke-width="2.5" stroke-dasharray="10 7"/>
  <text x="190" y="806" font-size="15" fill="#3a362e">مسار الكاميرا</text>

  <line x1="420" y1="800" x2="475" y2="800" stroke="#c0392b" stroke-width="2" stroke-dasharray="5 5"/>
  <text x="490" y="806" font-size="15" fill="#3a362e">خيط يتوصل بين الكروت</text>

  <text x="120" y="856" font-size="15" fill="#4a453c">كل كرت إله شريط وسم صغير: أرشيف + السنة / وثيقة رسمية / صورة حديثة (ليست من الفترة) / إعادة بناء AI</text>
  <text x="120" y="896" font-size="15" fill="#6b655a">السكتات: الكاميرا تبقى حيّة بحركة خفيفة بدل التجميد — والبورست يُتبع بلقطة تريّح أطول</text>
</svg>
